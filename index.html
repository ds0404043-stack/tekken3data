<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tekken 3 - PixelPlay</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #startGame {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;

            padding: 18px 35px;
            font-size: 20px;
            font-weight: bold;

            cursor: pointer;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <button id="startGame">START GAME</button>

    <div id="game"></div>

    <script>
        EJS_player = "#game";
        EJS_core = "psx";
        EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        EJS_startOnLoaded = true;
    </script>

    <script>
        const GAME_URL =
            "https://huggingface.co/datasets/deepakstack1234/tekken3data/resolve/main/tekken3.chd";

        const CACHE_NAME = "tekken3-single-chd-v1";

        document.getElementById("startGame").addEventListener("click", async function () {

            const button = this;

            button.disabled = true;
            button.textContent = "LOADING...";

            try {

                // Keep the game cached when possible
                if (navigator.storage && navigator.storage.persist) {
                    await navigator.storage.persist();
                }

                const cache = await caches.open(CACHE_NAME);

                let response = await cache.match(GAME_URL);

                if (response) {

                    console.log("Using cached Tekken 3 CHD");

                } else {

                    console.log("Downloading Tekken 3 CHD...");

                    response = await fetch(GAME_URL);

                    if (!response.ok) {
                        throw new Error(
                            "Tekken 3 CHD failed: " + response.status
                        );
                    }

                    await cache.put(GAME_URL, response.clone());

                    console.log("Tekken 3 CHD downloaded and cached");
                }

                const blob = await response.blob();

                EJS_gameUrl = URL.createObjectURL(blob);

                button.style.display = "none";

                const loader = document.createElement("script");

                loader.src =
                    "https://cdn.emulatorjs.org/stable/data/loader.js";

                document.body.appendChild(loader);

            } catch (error) {

                console.error("Tekken 3 error:", error);

                button.disabled = false;
                button.textContent = "START GAME";

                alert("Game loading failed. Check Console.");
            }

        });
    </script>
</body>

</html>
